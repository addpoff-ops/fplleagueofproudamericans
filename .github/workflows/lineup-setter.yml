# Runs the Lineup Setter every 5 minutes: the site checks whether team sheets
# are out for the next kickoff window and updates lineups for members who
# switched Lineup Setter on. (GitHub may delay scheduled runs by a few minutes;
# team sheets come out about an hour before kickoff, so that's fine.)
#
# Setup: in GitHub, Settings → Secrets and variables → Actions, add a
# repository secret CRON_SECRET with the same value as CRON_SECRET in Vercel.
name: Lineup Setter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check lineups
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://fplleagueofproudamericans.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set; skipping."; exit 0; fi
          curl -fsS -m 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/lineup-setter"
